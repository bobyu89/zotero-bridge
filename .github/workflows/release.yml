name: release

# Publishes dist/*.xpi as a GitHub Release when a new version lands on main.
# updates.json (Zotero's auto-update manifest) points at these release assets.
on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Create the release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v$VERSION"
          XPI="dist/zotero-bridge-$VERSION.xpi"
          test -f "$XPI"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"
            exit 0
          fi
          gh release create "$TAG" "$XPI" \
            --target "$GITHUB_SHA" \
            --title "Zotero Bridge $VERSION" \
            --notes "下載下方的 zotero-bridge-$VERSION.xpi，在 Zotero →「工具 → 插件 → 齒輪 → Install Plugin From File」安裝。需要 Zotero 10；Obsidian 建議 1.14 以上。安裝精靈：https://bobyu89.github.io/zotero-bridge/ ／使用說明：https://github.com/${GITHUB_REPOSITORY}#readme"

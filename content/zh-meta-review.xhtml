<?xml version="1.0" encoding="UTF-8"?>
<!--
	中文文獻補強: the review window (content/zh-meta.js review() opens it and renderReview() fills it).
	Layout and tokens: DESIGN.md (Review window). It borrows the 文獻自動分類 window's stylesheet (classify-review.css:
	tokens, head, list, foot) and adds the finding rows (zh-meta-review.css).
-->
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-bridge/content/classify-review.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-bridge/content/zh-meta-review.css" type="text/css"?>
<window id="zotero-bridge-zh-meta-window"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	title="中文文獻補強"
	width="760"
	height="640"
	persist="width height screenX screenY">
	<html:div id="zb-zhmeta" class="zb-classify zb-zhmeta"/>
</window>
